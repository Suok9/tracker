<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Map Dashboard - Vehicle Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root {
            --bg: #07111c;
            --panel: rgba(10, 20, 31, 0.88);
            --panel-border: rgba(148, 163, 184, 0.2);
            --accent: #38bdf8;
            --accent-2: #facc15;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        #info-overlay {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            width: min(380px, calc(100vw - 28px));
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.5);
            padding: 16px;
            backdrop-filter: blur(6px);
        }

        #info-overlay.hidden {
            display: none;
        }

        h3 {
            margin: 0 0 12px 0;
            font-size: 1.2rem;
        }

        .context-box {
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text);
        }

        .context-box strong {
            color: var(--accent);
        }

        .panel-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
        }

        .news-toggle, .panel-toggle {
            display: inline-block;
            margin-top: 10px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .news-panel.hidden {
            display: none;
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        .news-list li {
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        }

        .news-list a {
            color: var(--text);
            text-decoration: none;
        }

        .news-list a:hover {
            text-decoration: underline;
        }

        .news-list small {
            color: var(--muted);
            display: block;
            margin-top: 4px;
        }

        .vehicle-icon-style {
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4));
            transition: transform 0.2s linear;
        }
    </style>
</head>
<body>
    <div id="info-overlay">
        <h3>🚔 Live Fleet Monitor</h3>
        <div id="live-data" class="context-box">Waiting for transponder ping...</div>
        <div id="location-context" class="context-box panel-section"><strong>Location:</strong> awaiting signal...</div>
        <div id="route-summary" class="context-box panel-section"><strong>Route:</strong> no route yet.</div>

        <div id="news-panel" class="news-panel">
            <div id="news-feed" class="context-box panel-section">
                <strong>Related news:</strong>
                <ul class="news-list"><li>Connecting live context feed...</li></ul>
            </div>
        </div>

        <div style="display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap;">
            <button id="newsToggle" class="news-toggle" type="button">Hide News</button>
            <button id="panelToggle" class="panel-toggle" type="button">Hide Panel</button>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([20, 0], 3);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        const socket = io();
        const markers = {};
        const routeHistory = {};
        const routeLayers = {};

        const vehicleIcon = L.divIcon({
            html: '<div style="width:18px;height:18px;border-radius:50%;background:#38bdf8;border:3px solid white;box-shadow:0 0 10px rgba(56,189,248,0.85);"></div>',
            className: 'vehicle-icon-style',
            iconSize: [18, 18],
            iconAnchor: [9, 9],
            popupAnchor: [0, -12]
        });

        const newsToggleBtn = document.getElementById('newsToggle');
        const newsPanel = document.getElementById('news-panel');
        const panelToggleBtn = document.getElementById('panelToggle');
        const infoOverlay = document.getElementById('info-overlay');

        newsToggleBtn.addEventListener('click', () => {
            const hidden = newsPanel.classList.toggle('hidden');
            newsToggleBtn.textContent = hidden ? 'Show News' : 'Hide News';
        });

        panelToggleBtn.addEventListener('click', () => {
            const hidden = infoOverlay.classList.toggle('hidden');
            panelToggleBtn.textContent = hidden ? 'Show Panel' : 'Hide Panel';
        });

        function formatHeading(rawText, fallback = 'Location') {
            return rawText && rawText.trim() ? rawText.trim() : fallback;
        }

        function getLocationLabel(address = {}) {
            const parts = [
                address.city,
                address.town,
                address.village,
                address.municipality,
                address.county,
                address.state,
                address.country
            ].filter(Boolean);

            return parts.length ? parts.slice(0, 4).join(', ') : 'Current location';
        }

        async function fetchLocationInfo(lat, lng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Accept-Language': 'en' }
                });

                if (!response.ok) {
                    throw new Error('Reverse geocoding unavailable');
                }

                const data = await response.json();
                const label = getLocationLabel(data.address || {});
                const raw = data.display_name || label;

                document.getElementById('location-context').innerHTML = `
                    <strong>Location:</strong> ${formatHeading(label, raw)}<br>
                    <small>${raw}</small>
                `;
            } catch (error) {
                document.getElementById('location-context').innerHTML = `
                    <strong>Location:</strong> ${lat.toFixed(4)}, ${lng.toFixed(4)}
                `;
            }
        }

        function updateRouteHistory(id, lat, lng) {
            if (!routeHistory[id]) {
                routeHistory[id] = [];
                routeLayers[id] = L.polyline([], {
                    color: '#facc15',
                    weight: 4,
                    opacity: 0.9
                }).addTo(map);
            }

            routeHistory[id].push([lat, lng]);
            if (routeHistory[id].length > 80) {
                routeHistory[id].shift();
            }

            routeLayers[id].setLatLngs(routeHistory[id]);

            const totalPoints = routeHistory[id].length;
            const start = routeHistory[id][0];
            const end = routeHistory[id][totalPoints - 1];

            if (start && end) {
                const distanceKm = ((L.latLng(start).distanceTo(L.latLng(end)) / 1000)).toFixed(1);
                document.getElementById('route-summary').innerHTML = `
                    <strong>Route:</strong> ${totalPoints} points tracked<br>
                    <small>Last segment: ${distanceKm} km</small>
                `;
            }
        }

        async function fetchNewsContext() {
            const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/world/rss.xml';

            try {
                const res = await fetch(feedUrl);
                if (!res.ok) throw new Error('News feed unavailable');

                const data = await res.json();
                const articles = data.items ? data.items.slice(0, 4) : [];

                if (!articles.length) {
                    throw new Error('No news items');
                }

                const rendered = articles.map((item) => `
                    <li>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title || 'News update'}</a>
                        <small>${item.author || 'World News'}</small>
                    </li>
                `).join('');

                document.getElementById('news-feed').innerHTML = `
                    <strong>Related news:</strong>
                    <ul class="news-list">${rendered}</ul>
                `;
            } catch (error) {
                document.getElementById('news-feed').innerHTML = `
                    <strong>Related news:</strong>
                    <ul class="news-list"><li>Live context feed unavailable right now.</li></ul>
                `;
            }
        }

        socket.on('connect', () => {
            socket.emit('dashboard:subscribe');
            fetchNewsContext();
        });

        socket.on('fleet:state', (assets) => {
            const assetList = Array.isArray(assets) ? assets : [];
            assetList.forEach((asset) => {
                const { id, label, lat, lng, speed, timestamp } = asset;
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                    return;
                }

                document.getElementById('live-data').innerHTML = `
                    <strong>Asset:</strong> ${label || id}<br>
                    <strong>ID:</strong> ${id}<br>
                    <strong>Lat:</strong> ${lat.toFixed(5)}<br>
                    <strong>Lng:</strong> ${lng.toFixed(5)}<br>
                    <strong>Speed:</strong> ${Math.round((speed || 0) * 3.6)} km/h<br>
                    <strong>Last ping:</strong> ${new Date(timestamp || Date.now()).toLocaleTimeString()}
                `;

                updateRouteHistory(id, lat, lng);
                fetchLocationInfo(lat, lng);

                if (markers[id]) {
                    markers[id].setLatLng([lat, lng]);
                } else {
                    const m = L.marker([lat, lng], { icon: vehicleIcon }).addTo(map);
                    markers[id] = m;
                    m.bindPopup(`<b>Asset ID:</b> ${label || id}<br><span style="color:gray;">Transponder Active</span>`).openPopup();
                }

                map.setView([lat, lng], 16);
            });
        });
    </script>
</body>
</html>
