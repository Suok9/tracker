<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Transponder</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background: #101827;
            color: #e5e7eb;
        }
        .btn {
            background: #0ea5e9;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
        }
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #4ade80;
        }
        #telemetry {
            margin-top: 28px;
            font-size: 1.05rem;
            line-height: 1.8;
        }
        .input-wrap {
            margin-top: 18px;
        }
        input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            width: min(320px, 80vw);
        }
    </style>
</head>
<body>
    <h1>🛰️ Software Transponder</h1>
    <p>Press start to begin broadcasting live telemetry.</p>

    <div class="input-wrap">
        <label for="assetId">Asset ID</label><br>
        <input id="assetId" type="text" placeholder="Leave blank to auto-generate an ID" />
    </div>

    <button id="startButton" class="btn" onclick="startTransponder()">Activate Transponder</button>
    <div id="status" class="status">Status: Idle</div>
    <div id="telemetry"></div>

    <script>
        const socket = io();
        let watchId = null;

        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }

        function startTransponder() {
            const input = document.getElementById('assetId');
            const startButton = document.getElementById('startButton');
            const requestedId = input.value.trim();
            updateStatus('Status: Connecting to tracker...');

            if (!navigator.geolocation) {
                updateStatus('Status: GPS not supported in this browser');
                return;
            }

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            startButton.disabled = true;
            socket.timeout(10000).emit(
                'transponder:register',
                { id: requestedId, label: requestedId },
                (error, response) => {
                    startButton.disabled = false;
                    if (error || !response || !response.ok || !response.id) {
                        updateStatus('Status: Unable to connect to tracker');
                        return;
                    }

                    const assetId = response.id;
                    input.value = assetId;
                    watchId = navigator.geolocation.watchPosition(
                        (position) => {
                            const payload = {
                                id: assetId,
                                label: assetId,
                                lat: position.coords.latitude,
                                lng: position.coords.longitude,
                                speed: position.coords.speed || 0,
                                timestamp: Date.now()
                            };

                            socket.emit('transponder:position', payload);

                            const telemetry = document.getElementById('telemetry');
                            telemetry.replaceChildren();
                            [
                                ['Asset ID:', payload.id],
                                ['Lat:', payload.lat.toFixed(5)],
                                ['Lng:', payload.lng.toFixed(5)],
                                ['Speed:', `${Math.round(payload.speed * 3.6)} km/h`]
                            ].forEach(([label, value]) => {
                                const line = document.createElement('p');
                                const strong = document.createElement('strong');
                                strong.textContent = `${label} `;
                                line.append(strong, document.createTextNode(value));
                                telemetry.appendChild(line);
                            });

                            updateStatus('Status: Transponder ACTIVE & Broadcasting');
                        },
                        (gpsError) => {
                            updateStatus(`Status: GPS Error: ${gpsError.message}`);
                        },
                        {
                            enableHighAccuracy: true,
                            maximumAge: 0,
                            timeout: 10000
                        }
                    );
                }
            );
        }
    </script>
</body>
</html>
