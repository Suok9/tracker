<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Transponder</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
            background: #101827;
            color: #e5e7eb;
        }
        .btn {
            background: #0ea5e9;
            border: none;
            border-radius: 8px;
            color: white;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
        }
        .status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #4ade80;
        }
        #telemetry {
            margin-top: 28px;
            font-size: 1.05rem;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <h1>🛰️ Software Transponder</h1>
    <p>Press start to begin broadcasting live telemetry.</p>
    <button class="btn" onclick="startTransponder()">Activate Transponder</button>
    <div id="status" class="status">Status: Idle</div>
    <div id="telemetry"></div>

    <script>
        const socket = io();
        const ASSET_ID = 'asset-vehicle-01';
        let watchId = null;

        function updateStatus(message) {
            document.getElementById('status').innerText = message;
        }

        function startTransponder() {
            updateStatus('Status: Connecting to tracker...');

            socket.emit('transponder:register', { id: ASSET_ID });

            if (!navigator.geolocation) {
                updateStatus('Status: GPS not supported in this browser');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const payload = {
                        id: ASSET_ID,
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        speed: position.coords.speed || 0,
                        timestamp: Date.now()
                    };

                    socket.emit('transponder:position', payload);

                    document.getElementById('telemetry').innerHTML = `
                        <p><strong>Asset ID:</strong> ${payload.id}</p>
                        <p><strong>Lat:</strong> ${payload.lat.toFixed(5)}</p>
                        <p><strong>Lng:</strong> ${payload.lng.toFixed(5)}</p>
                        <p><strong>Speed:</strong> ${Math.round(payload.speed * 3.6)} km/h</p>
                    `;

                    updateStatus('Status: Transponder ACTIVE & Broadcasting');
                },
                (error) => {
                    updateStatus(`Status: GPS Error: ${error.message}`);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }
    </script>
</body>
</html>
